name: Android build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Set up Rust Android linker
        run: cargo install cargo-ndk --locked
      - name: Test Rust backend
        run: cargo test --manifest-path native/Cargo.toml
      - name: Check theme color tokens
        run: bash scripts/check-theme-colors.sh
      - name: Test Android unit suite
        run: ./gradlew :app:testDebugUnitTest
      - name: Check release APK size
        run: ./gradlew checkReleaseApkSize
      - name: Build debug APK
        run: bash ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: netray-android-debug
          path: app/build/outputs/apk/debug/*.apk
