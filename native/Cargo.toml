[package]
name = "netray-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "netray_backend"
crate-type = ["cdylib"]

[dependencies]
jni = { version = "0.21", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
url = "2"
uuid = "1"
